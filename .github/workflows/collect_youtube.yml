name: YouTube �곗씠�� �먮룞 �섏쭛

on:
  schedule:
    - cron: '0 7 * * *'  # 留ㅼ씪 UTC 07:00 = KST 16:00
  workflow_dispatch:       # �섎룞 �ㅽ뻾 踰꾪듉

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: �덊룷 泥댄겕�꾩썐
        uses: actions/checkout@v4

      - name: Python �ㅼ젙
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: �⑦궎吏� �ㅼ튂
        run: pip install requests

      - name: YouTube �곗씠�� �섏쭛
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python collect_youtube.py

      - name: 寃곌낵 而ㅻ컠 & �몄떆
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/youtube_latest.json
          git diff --staged --quiet || git commit -m "auto: YouTube �곗씠�� �섏쭛 $(date +'%Y-%m-%d %H:%M KST')"
          git push
